name: Libby
options:
  bundleIdPrefix: com.markenos
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Libby:
    type: application
    platform: macOS
    sources:
      - path: Libby
    info:
      path: Libby/Info.plist
      properties:
        CFBundleName: Libby
        CFBundleDisplayName: Libby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Libby shows your upcoming events alongside your mail and messages.
        NSRemindersFullAccessUsageDescription: Libby shows your reminders and lets you tick them off.
        NSContactsUsageDescription: Libby shows contact names instead of phone numbers in Messages.
        NSAppleEventsUsageDescription: Libby asks Mail and Messages to send, reply, flag, archive and delete on your behalf.
    entitlements:
      path: Libby/Libby.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markenos.Libby
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
